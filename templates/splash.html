<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GNMTC SRC</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background: linear-gradient(135deg, #0f3d3e 0%, #1a6b47 60%, #2a9d6f 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', -apple-system, sans-serif;
            overflow: hidden;
            position: relative;
        }

        /* Soft glow orbs in background */
        body::before {
            content: '';
            position: absolute;
            top: -200px;
            right: -150px;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(251, 191, 36, 0.35) 0%, transparent 70%);
            border-radius: 50%;
            filter: blur(60px);
            animation: float 6s ease-in-out infinite;
        }

        body::after {
            content: '';
            position: absolute;
            bottom: -200px;
            left: -150px;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.2) 0%, transparent 70%);
            border-radius: 50%;
            filter: blur(60px);
            animation: float 8s ease-in-out infinite reverse;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }

        .splash-wrap {
            text-align: center;
            position: relative;
            z-index: 2;
            padding: 2rem;
            animation: fadeInUp 0.8s ease both;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .splash-logo-wrap {
            position: relative;
            display: inline-block;
            margin-bottom: 1.5rem;
        }

        .splash-logo {
            width: 140px;
            height: 140px;
            object-fit: contain;
            border-radius: 30px;
            background: rgba(255, 255, 255, 0.1);
            padding: 16px;
            border: 2px solid rgba(255, 255, 255, 0.25);
            box-shadow:
                0 20px 60px rgba(0, 0, 0, 0.4),
                0 0 80px rgba(251, 191, 36, 0.4);
            backdrop-filter: blur(10px);
            animation: pulse 2.4s ease-in-out infinite;
        }

        .splash-logo-fallback {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            color: #ffffff;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 20px 60px rgba(0, 0, 0, 0.4), 0 0 80px rgba(251, 191, 36, 0.4);
            }
            50% {
                transform: scale(1.04);
                box-shadow: 0 20px 70px rgba(0, 0, 0, 0.5), 0 0 100px rgba(251, 191, 36, 0.6);
            }
        }

        .splash-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.85rem;
            font-weight: 700;
            color: #ffffff;
            margin-bottom: 0.5rem;
            letter-spacing: -0.02em;
            text-shadow: 0 2px 20px rgba(0, 0, 0, 0.3);
        }

        .splash-subtitle {
            font-size: 0.95rem;
            color: rgba(255, 255, 255, 0.85);
            font-weight: 500;
            letter-spacing: 0.05em;
            margin-bottom: 0.15rem;
        }

        .splash-tagline {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.65);
            text-transform: uppercase;
            letter-spacing: 0.15em;
            font-weight: 600;
        }

        .splash-loader {
            display: inline-flex;
            gap: 0.5rem;
            margin-top: 2rem;
        }

        .splash-loader span {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #fbbf24;
            animation: bounce 1.2s ease-in-out infinite;
        }

        .splash-loader span:nth-child(2) { animation-delay: 0.15s; }
        .splash-loader span:nth-child(3) { animation-delay: 0.3s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0.7); opacity: 0.5; }
            40% { transform: scale(1.1); opacity: 1; }
        }

        .splash-footer {
            position: fixed;
            bottom: 1.5rem;
            left: 0;
            right: 0;
            text-align: center;
            font-size: 0.7rem;
            color: rgba(255, 255, 255, 0.45);
            letter-spacing: 0.08em;
        }
    </style>
</head>
<body>
    <div class="splash-wrap">
        <div class="splash-logo-wrap">
            <img src="{{ url_for('static', filename='uploads/logo.png') }}"
                 alt="GNMTC SRC"
                 class="splash-logo"
                 onerror="this.onerror=null;this.style.display='none';this.nextElementSibling.style.display='flex';">
            <div class="splash-logo splash-logo-fallback" style="display:none;">🩺</div>
        </div>

        <div class="splash-title">GNMTC SRC</div>
        <div class="splash-subtitle">Goaso Midwifery &amp; Training College</div>
        <div class="splash-tagline">Students' Representative Council</div>

        <div class="splash-loader">
            <span></span><span></span><span></span>
        </div>
    </div>

    <div class="splash-footer">Powered by GNMTC SRC</div>

    <script>
        // Auto-redirect after 3 seconds
        setTimeout(function () {
            window.location.href = "{{ url_for('index') }}";
        }, 3000);
    </script>
</body>
</html>
