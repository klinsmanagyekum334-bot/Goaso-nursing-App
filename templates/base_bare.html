<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}GNMTC SRC APP{% endblock %}</title>

    <!-- ============ iOS "Add to Home Screen" Support ============ -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="GNMTC SRC">
    <meta name="theme-color" content="#1a6b47">
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='uploads/logo.png') }}">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='uploads/logo.png') }}">
    <link rel="manifest" href="{{ url_for('manifest') }}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <!-- ============ CSRF Token (for JS fetch calls) ============ -->
    <meta name="csrf-token" content="{{ csrf_token() }}">
</head>
<body class="bare-body">

{% block content %}{% endblock %}

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- ============ GLOBAL CSRF INJECTION ============ -->
<!-- Auto-injects the CSRF token into every POST form and every fetch() call. -->
<script>
  (function () {
    const CSRF_TOKEN = '{{ csrf_token() }}';

    // 1. Add hidden csrf_token to every <form method="POST"> that lacks it
    function injectCsrfIntoForms() {
      document.querySelectorAll('form').forEach(function (form) {
        const method = (form.getAttribute('method') || 'GET').toUpperCase();
        if (method !== 'POST') return;
        if (form.querySelector('input[name="csrf_token"]')) return;

        const input = document.createElement('input');
        input.type = 'hidden';
        input.name = 'csrf_token';
        input.value = CSRF_TOKEN;
        form.appendChild(input);
      });
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', injectCsrfIntoForms);
    } else {
      injectCsrfIntoForms();
    }

    // 2. Wrap fetch() to add X-CSRFToken header to every POST
    const originalFetch = window.fetch;
    window.fetch = function (url, options) {
      options = options || {};
      const method = (options.method || 'GET').toUpperCase();

      if (method === 'POST') {
        let headers = options.headers || {};
        if (headers instanceof Headers) {
          headers.set('X-CSRFToken', CSRF_TOKEN);
        } else {
          headers['X-CSRFToken'] = CSRF_TOKEN;
        }
        options.headers = headers;
      }

      return originalFetch.call(this, url, options);
    };
  })();
</script>

</body>
</html>
